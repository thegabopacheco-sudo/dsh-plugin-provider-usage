# dsh-plugin-provider-usage — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "usage".
# Tools resultantes: mcp__usage__* (ver README).
- insert:
    - id: mcp-provider-usage
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: usage
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/provider-usage/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
